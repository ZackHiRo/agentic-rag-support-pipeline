services:
  app:
    build: .
    container_name: everdawn-support
    ports:
      - "8000:8000"
    env_file:
      - path: .env            # copy .env.example → .env; optional in mock mode
        required: false
    environment:
      PIPELINE_MODE: ${PIPELINE_MODE:-mock}
      # To use Postgres: `docker compose --profile postgres up` and uncomment:
      # DATABASE_URL: postgresql+psycopg://everdawn:everdawn@db:5432/everdawn
    volumes:
      - ./data:/app/data        # SQLite database + uploaded screenshots
      - ./.chroma:/app/.chroma  # vector index (live mode)
      - ./kb:/app/kb            # knowledge base markdown
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: everdawn
      POSTGRES_PASSWORD: everdawn
      POSTGRES_DB: everdawn
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
